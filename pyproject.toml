[project]
name = "whatsapp-automation"
version = "0.1.0"
description = "Gemini-powered WhatsApp Cloud API support chatbot"
readme = "Readme.md"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.2",
    "google-genai>=2.0.0",
    "python-dotenv>=1.0.1",
    "requests>=2.32.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
